<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="index.js" defer></script>
</head>
<body>
    <div id="welcome">
        <h3>Welcome!</h3>
        <h3 id="localDateTime"></h3>
    </div>

    <form>
        <div id="searchbar">
            <input type="text" id="locationInput" 
            placeholder= 'Enter a city, zipcode, or coordinates...' required><br>
            <label for="locationInput">Ex: "Dallas", "Dallas, TX", "75001", "+32.7767, -96.7970"</label><br>
        </div>
        
        <button type="button">Get Weather!</button>
    </form>

    <div id="dataDisplay">
        <h1>Look up a place &#x3a;&#x29;</h1>
    </div>
</body>
</html>
